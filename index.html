    <!--
      Fallback page title only. Every route renders SEO (src/components/SEO.tsx),
      which emits description, canonical, Open Graph, Twitter, robots and geo
      tags via react-helmet-async.

      DO NOT put description / canonical / og: / twitter: tags back here.
      Helmet does not replace tags it did not create, so static copies here get
      DUPLICATED alongside the per-route ones - and because the static tag comes
      first in the document, every subpage ended up serving a canonical pointing
      at the homepage plus the homepage's description.
    -->
    <title>Saltarelli Web Studio | Get Found on Google, Win More Customers</title>
